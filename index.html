<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================================
         BASIC
    ========================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#000000"
    >


    <!-- =========================================
         TITLE
    ========================================== -->

    <title>xM4th3us</title>


    <!-- =========================================
         DESCRIPTION
    ========================================== -->

    <meta
        name="description"
        content="xM4th3us // personal profile"
    >


    <!-- =========================================
         CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- =========================================
         README
    ========================================== -->

    <main id="readme">

        <p class="loading">
            loading...
        </p>

    </main>



    <!-- =========================================
         BACKGROUND MUSIC
    ========================================== -->

    <audio
        id="backgroundMusic"
        loop
        preload="auto"
        autoplay
    >

        <source
            src="./assets/background/everynight.mp3"
            type="audio/mpeg"
        >

        Your browser does not support audio.

    </audio>



    <!-- =========================================
         SOUND BUTTON
    ========================================== -->

    <button
        id="soundButton"
        type="button"
        aria-label="Toggle background music"
    >
        SOUND OFF
    </button>



    <!-- =========================================
         MARKDOWN PARSER
    ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"
    ></script>



    <!-- =========================================
         SITE SCRIPT
    ========================================== -->

    <script
        src="./script.js"
    ></script>


</body>

</html>
